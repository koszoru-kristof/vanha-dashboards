<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Espoo flat &mdash; 3D</title>
    <style>
      :root {
        --bg: #11151a;
        --panel: #181e26;
        --panel-2: #1f2732;
        --line: #2b3542;
        --fg: #dfe6ef;
        --dim: #8b97a7;
        --accent: #2f9e7e;
        --warn: #d98b3a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--fg);
        font: 13px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", Inter, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #hud { position: fixed; top: 14px; left: 16px; pointer-events: none; }
      #hud h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
      #hud p  { margin: 2px 0 0; font-size: 11.5px; color: var(--dim); }

      #panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: 310px;
        background: var(--panel); border-left: 1px solid var(--line);
        display: flex; flex-direction: column; transition: transform .18s ease;
      }
      #panel.hidden { transform: translateX(310px); }
      #panel header {
        padding: 12px 14px; border-bottom: 1px solid var(--line);
        display: flex; align-items: center; justify-content: space-between;
      }
      #panel header b { font-size: 12px; text-transform: uppercase;
        letter-spacing: .08em; color: var(--dim); font-weight: 600; }
      #panel .body { overflow-y: auto; flex: 1; padding: 4px 0 24px; }

      .group { border-bottom: 1px solid var(--line); }
      .group > h2 {
        margin: 0; padding: 9px 14px 6px; font-size: 11px; font-weight: 600;
        letter-spacing: .07em; text-transform: uppercase; color: var(--dim);
        display: flex; justify-content: space-between; align-items: baseline;
      }
      .group > h2 span { font-size: 10px; letter-spacing: 0; text-transform: none; }

      .row { display: flex; align-items: center; gap: 8px; padding: 4px 14px; }
      .row:hover { background: var(--panel-2); }
      .row .nm { flex: 1; min-width: 0; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      .row .nm small { color: var(--dim); }
      .row .val { color: var(--dim); font-variant-numeric: tabular-nums;
        font-size: 11.5px; min-width: 62px; text-align: right; }
      .row.clickable { cursor: pointer; }
      .row.on .nm { color: #fff; }

      .dot { width: 8px; height: 8px; border-radius: 50%;
        background: #3b4655; flex: none; }
      .dot.on { background: var(--accent); box-shadow: 0 0 7px var(--accent); }
      .dot.alert { background: var(--warn); box-shadow: 0 0 7px var(--warn); }

      input[type=range] { width: 74px; accent-color: var(--accent); }

      .controls { padding: 10px 14px; display: grid; gap: 7px; }
      .controls label { display: flex; align-items: center; gap: 8px;
        color: var(--dim); cursor: pointer; }
      .controls input[type=checkbox] { accent-color: var(--accent); }

      button.ghost {
        background: transparent; color: var(--dim); border: 1px solid var(--line);
        border-radius: 5px; padding: 3px 8px; cursor: pointer; font: inherit;
        font-size: 11px;
      }
      button.ghost:hover { color: var(--fg); border-color: #3d4a5a; }

      #toggle { position: fixed; top: 12px; right: 12px; z-index: 5; }
      #panel:not(.hidden) ~ #toggle { display: none; }

      #tip {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        color: var(--dim); font-size: 11.5px; pointer-events: none;
        background: rgba(17,21,26,.7); padding: 5px 11px; border-radius: 20px;
      }
      #hover {
        position: fixed; pointer-events: none; z-index: 9; display: none;
        background: #0c1014e6; border: 1px solid var(--line); border-radius: 5px;
        padding: 4px 8px; font-size: 11.5px; white-space: nowrap;
      }
      #loading { position: fixed; inset: 0; display: grid; place-items: center;
        color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">building the flat&hellip;</div>
    <div id="hud">
      <h1>Espoo flat</h1>
      <p>2 rooms + kitchenette + sauna &middot; 45.5 m&sup2; &middot; 3rd floor of 3 &middot; built 1997</p>
    </div>
    <div id="hover"></div>
    <aside id="panel">
      <header>
        <b>Devices</b>
        <button class="ghost" id="hide">hide</button>
      </header>
      <div class="body" id="panel-body"></div>
    </aside>
    <button class="ghost" id="toggle">devices</button>
    <div id="tip">drag to orbit &middot; scroll to zoom &middot; click a device marker to toggle</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
